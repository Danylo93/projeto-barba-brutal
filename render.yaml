# Blueprint do Render — backend NestJS (plano free)
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: barba-brutal-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev é obrigatório: com NODE_ENV=production o npm pularia as
    # devDependencies e o @nestjs/cli (nest build) não seria instalado
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/src/main
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # cole a URL POOLED do Neon (com -pooler e ?sslmode=require)
      - key: DIRECT_URL
        sync: false # cole a URL DIRETA do Neon (sem -pooler)
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false # ex.: https://seu-app.vercel.app
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      # WhatsApp (Evolution API) — confirmação de plano e notificações
      - key: EVOLUTION_URL
        sync: false # ex.: https://evolution.seudominio.com
      - key: EVOLUTION_APIKEY
        sync: false
      - key: EVOLUTION_INSTANCE
        sync: false # nome da instância conectada ao número
      # E-mail de notificação — sem SMTP_HOST o envio fica desativado (só log)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false # ex.: nao-responda@suamarca.com.br
